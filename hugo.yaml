    params:
      moto: "Unchecked Spying Harms Your Privacy, Constitutional Rights, and Communities Under Attack"
      p1:
        heading: "What's Going On?"
        content:
          - text: |
              In 2023, the Fairfax County Police Department began using [Flock Safety License Plate Readers](https://www.ffxnow.com/2023/11/21/county-approves-funds-to-expand-fcpds-automatic-license-plate-reader-program/). 
              Unlike normal traffic cameras, automated license plate readers (ALPRs) [continually monitor](https://www.aclu.org/wp-content/uploads/publications/flock_1.pdf)
              all traffic to uniquely profile every passing vehicle and create an easily searchable history of its movements [without a warrant](https://www.cato.org/blog/schmidt-v-city-norfolk-brief-automated-license-plate-readers-commit-fourth-amendment-searches?utm_campaign=Cato_Today&utm_medium=email&utm_source=Cato_Email&utm_content=260421-Cato_Today).
              Flock gained national attention for its collection of [over 120,000 cameras](https://unwall.app/www.nytimes.com/2026/08/10/us/flock-cameras-can-track-every-car-in-america-police-love-them-citizens-dont.html) being used to:
          - text: |
              - Stalk police officers' [ex-romantic partners](https://ij.org/police-have-reportedly-used-license-plate-readers-to-stalk-romantic-interests-at-least-14-times-in-recent-years/).
              - Wrongfully target innocent people who were [held at gunpoint](https://www.cbsnews.com/news/license-plate-readers-alpr-mistakes/), [attacked by a K-9](https://www.wtol.com/article/news/local/city-of-toledo-to-pay-brandon-upchurch-35000-dollar-settlement-in-k9-attack-traffic-stop-local-news/512-e6ad4d91-75de-4bc7-a088-5aebbdd0907e), and [jailed](https://ij.org/dozens-of-innocent-motorists-have-been-pulled-over-detained-at-gunpoint-or-jailed-due-to-ai-license-plate-camera-errors/).
              - Surveil people exercising their [First Amendment rights](https://www.eff.org/deeplinks/2025/11/how-cops-are-using-flock-safetys-alpr-network-surveil-protesters-and-activists).
              - Conduct a nationwide search for a [Texas woman getting an abortion](https://www.eff.org/deeplinks/2025/10/flock-safety-and-texas-sheriff-claimed-license-plate-search-was-missing-person-it)
              - Send [gun-show customers'](https://www.wsj.com/articles/gun-show-customers-license-plates-come-under-scrutiny-1475451302) information to federal agents
              - Assist [ICE's immigration crackdown](https://www.404media.co/ice-taps-into-nationwide-ai-enabled-camera-network-data-shows/).
              - Tell an [innocent woman](https://www.404media.co/cop-used-flock-to-wrongfully-accuse-a-woman-then-refused-to-look-at-evidence-that-exonerated-her-body-camera-shows/), "You can't get a breath of fresh air...without us knowing."
          - text: |
              It isn't possible to verify how FCPD uses ALPR cameras because ALPR logs are not subject to FOIA requests.
              FCPD shares continuous data from its 80+ Flock cameras and 700+ Axon cameras with [over 160 agencies](/documents/LPRAgencySharing.pdf). 
              These agencies can search our cameras however they like, without any accountability.
              Moreover, all Flock data is owned by Flock, not FCPD. Its [terms and conditions](https://www.aclu.org/news/privacy-technology/tracking-alpr-cameras/flocks-terms-and-conditions) grant the company, "the exclusive right to determine and control the method, timing, format, and medium" of access to the data.
          - text: |
              Virginia passed a [law](https://lis.virginia.gov/bill-details/20251/HB2724) in 2025 regulating ALPR usage, limiting data sharing and retention periods.
              In 2026, the Crime Commission released [police departments' self-reported ALPR usage](https://vscc.virginia.gov/2026/VSCC%20ALPR%20Report%20January%202026%20FINAL%20REVISED%20Jan%2021%202026.pdf).
              A third of departments didn't respond. Of the respondents using ALPRs:
          - text: |
              - 35% haven't promoted public awareness of ALPR usage
              - 16% don't have an ALPR policy
              - 21% keep data longer than 21 days
              - 13% share continuous ALPR data with out-of-state agencies
              - 6% share continuous ALPR data with federal agencies
              - These are all violations of the law
              - The report didn't say which departments broke the law
              - The report didn't indicate any departments would face consequences
          - text: |
              Flock [admitted to lying](https://www.msn.com/en-us/politics/government/flock-admits-federal-immigration-agents-have-direct-access-to-tracking-data-despite-previous-claims/ar-AA1KQLP0)
              about sending data to immigration enforcement.
              Flock has [lied](https://www.msn.com/en-us/news/us/oshkosh-council-rescinds-flock-camera-contract-after-false-statements/ar-AA21wc5D)
              to a Wisconsin city council about surveillance features. 
              Data about our daily movements is entrusted to a private company whose integrity is suspect.
              Regulating Flock has failed, and its lawful usage relies on broken promises from the company itself.
          - text: |
              [Other Virginia police departments](/wins) have terminated their Flock contracts. 
              It's time for Fairfax County to follow suit. 
              It's time to de-Flock.
          - text: |
              [**Urge the Fairfax County Board of Supervisors to remove ALPRs&nbsp;&rarr;** ](https://actionnetwork.org/letters/board-of-supervisors-email)
          - text: |
              [**Take action against ALPRs by filling out our interest form&nbsp;&rarr;** ](https://bit.ly/DFAction)
      p2:
        heading: "Flock Doesn't Make Us Safer"
        image: "images/pages/lpr-demo.webp"
        content:
          - text: |
              Flock claims its cameras have solved 10% of reported crimes in the US.
              This comes from a study [predominantly written by Flock employees](https://www.404media.co/researcher-who-oversaw-flock-surveillance-study-now-has-concerns-about-it/),
              and its other claims about safety have faced [skepticism from academics](https://www.wired.com/story/flock-safety-license-plate-readers-crime/). 
          - text: |
              The Denver police department canceled its Flock contract, and after the cameras were removed, [auto thefts went down](https://www.9news.com/article/news/local/local-politics/denvers-license-plate-cameras-auto-theft-dropped/73-73295672-9b03-45c2-a4c0-a38355ed84bb). 
              FBI statistics show that increased ALPRs in Atlanta [didn't improve crime clearance rates](https://futurism.com/future-society/flock-surveillance-atlanta-fbi-data-crime-case-solve).
          - text: |
              Contrary to the idea that there is "no expectation of privacy in public," the Supreme Court explicitly [stated](https://web.archive.org/web/20180623061246/https://www.law.cornell.edu/supremecourt/text/16-402)
              "A person does not surrender all Fourth Amendment protection by venturing into the public sphere."
          - text: |
              [Flock's security is abysmal](https://www.404media.co/flock-exposed-its-ai-powered-cameras-to-the-internet-we-tracked-ourselves/).
              Several cameras upload to the internet unencrypted, allowing anyone to observe people at markets, joggers on trails, and children at playgrounds.
              [Russian hackers](https://techcrunch.com/2025/11/03/lawmakers-say-stolen-police-logins-are-exposing-flock-surveillance-cameras-to-hackers/) gained access to Flock footage because Flock doesn't require basic security measures.
          - text: |
              Police departments collect Flock data without warrants. Officers have been told to "[be as vague as permissible](https://www.404media.co/police-told-to-be-as-vague-as-permissible-about-why-they-use-flock/)"
              for why they are using Flock. Virginia police have issued [thousands of searches](https://vcij.org/stories/virginia-police-search-vehicle-surveillance-data-247-why-isnt-always-clear)
              with vague, one-word justifications such as "suspect," "suspicious," or even "123." 
          - text: |
              This is unambiguous surveillance which can and has been easily abused. 
              The best way to avoid abuse is to prevent systems which provide the opportunity for such abuse.
      p3:
        heading: "Supporting Organizations"
        content:
          - text: |
              These churches, activist groups, and nonprofits agree that Fairfax County should amend its contracts to remove ALPR systems.
              If you're part of an organization that would be interested in signing on, please [reach out](/contact).
              Take a stand and fight back against unchecked surveillance that hurts you and your neighbors!
